// ── Pricing API ────────────────────────────────────────────────────────────
// ── Scryfall (MTG) price lookup ───────────────────────────────────────────
async function fetchScryfallPrice(card) {
  const name=card.player.replace(/\s*\(.*?\)\s*/g,"").trim();
  let data=null;
  if(card.brand&&card.cardNumber){
    const setRes=await fetch("https://api.scryfall.com/sets");
    const sets=await setRes.json();
    const setObj=sets.data&&sets.data.find(s=>s.name.toLowerCase()===card.brand.toLowerCase()||s.code.toLowerCase()===card.brand.toLowerCase());
    if(setObj){const r=await fetch("https://api.scryfall.com/cards/"+setObj.code+"/"+card.cardNumber);if(r.ok)data=await r.json();}
  }
  if(!data||data.object==="error"){
    const r=await fetch("https://api.scryfall.com/cards/named?fuzzy="+encodeURIComponent(name)+(card.brand?"&set="+encodeURIComponent(card.brand):""));
    if(r.ok)data=await r.json();
    else{const r2=await fetch("https://api.scryfall.com/cards/named?fuzzy="+encodeURIComponent(name));if(r2.ok)data=await r2.json();else throw new Error("Not found on Scryfall: "+card.player);}
  }
  if(!data||data.object==="error")throw new Error("Card not found: "+card.player);
  const prices=data.prices||{};
  const isFoil=card.notes&&/foil/i.test(card.notes);
  const raw=isFoil?(prices.usd_foil||prices.usd):(prices.usd||prices.usd_foil);
  const avg=raw?parseFloat(raw):null;
  const setName=data.set_name||card.brand||"Unknown Set";
  const summary=data.name+" from "+setName+" ("+data.rarity+"). TCGPlayer market price: $"+(avg!=null?avg.toFixed(2):"N/A")+". "+(isFoil?"Foil pricing applied.":"Non-foil pricing.");
  return{lowPrice:avg?avg*0.85:null,highPrice:avg?avg*1.15:null,avgPrice:avg,recentSales:[{price:avg,condition:"Near Mint",date:"Current",source:"TCGPlayer via Scryfall",notes:isFoil?"Foil":"Non-foil"}],marketTrend:"Stable",summary,searchQuery:card.player+" "+setName,dataSource:"Scryfall / TCGPlayer (free API)"};
}

// ── Pokemon TCG price lookup ──────────────────────────────────────────────
async function fetchPokemonPrice(card) {
  const name=card.player.replace(/\s*\(.*?\)\s*/g,"").trim();
  let url="https://api.pokemontcg.io/v2/cards?q=name:"+encodeURIComponent('"'+name+'"');
  if(card.brand)url+=" set.name:"+encodeURIComponent('"'+card.brand+'"');
  if(card.cardNumber)url+=" number:"+encodeURIComponent(card.cardNumber);
  url+="&pageSize=5";
  const res=await fetch(url);
  const data=await res.json();
  if(!data.data||data.data.length===0)throw new Error("Not found in Pokemon TCG database: "+card.player);
  const match=data.data[0];
  const prices=match.tcgplayer?.prices;
  let avg=null,low=null,high=null;
  if(prices){const tier=prices.holofoil||prices.reverseHolofoil||prices.normal||prices["1stEditionHolofoil"]||prices["1stEditionNormal"];if(tier){avg=tier.market||tier.mid||null;low=tier.low||null;high=tier.high||null;}}
  const setName=match.set?.name||card.brand||"Unknown Set";
  const summary=match.name+" — "+setName+" #"+(match.number||card.cardNumber)+". Market: $"+(avg!=null?avg.toFixed(2):"N/A")+". "+(match.rarity||"")+" TCGPlayer pricing.";
  return{lowPrice:low,highPrice:high,avgPrice:avg,recentSales:[{price:avg,condition:"Near Mint",date:"Current",source:"TCGPlayer",notes:match.rarity||""}],marketTrend:"Stable",summary,searchQuery:card.player+" "+setName,dataSource:"Pokemon TCG API / TCGPlayer (free)"};
}

// ── Claude/Cloudflare price lookup (sports + other) ───────────────────────
async function fetchClaudePrice(card) {
  const parts=[];
  if(card.year)parts.push(card.year);
  parts.push(card.player);
  if(card.brand)parts.push(card.brand);
  parts.push(card.sport+" card");
  if(card.notes)parts.push(card.notes);
  if(card.grade)parts.push((card.gradeType||"PSA")+" "+card.grade);
  if(card.rookie)parts.push("rookie");
  const searchQuery=parts.join(" ").trim();
  const userMessage="Search for the current resale price of this trading card: "+searchQuery+"\nCard: "+card.player+" | Set: "+(card.brand||"unknown")+" | #"+(card.cardNumber||"?")+"\nType: "+card.sport+" | Condition: "+(card.grade?(card.gradeType||"PSA")+" "+card.grade:card.condition||"Near Mint")+(card.notes?" | Variant: "+card.notes:"")+"\n\nSearch eBay, COMC, Beckett Marketplace, PWCC, and MySlabs for recent sold prices.\n\nRespond with ONLY a raw JSON object:\n{\"lowPrice\":1.50,\"highPrice\":5.00,\"avgPrice\":3.00,\"recentSales\":[{\"price\":3.00,\"condition\":\"NM\",\"date\":\"May 2026\",\"source\":\"eBay\",\"notes\":\"\"}],\"marketTrend\":\"Stable\",\"summary\":\"summary here.\",\"searchQuery\":\""+searchQuery.replace(/"/g,"'")+"\",\"dataSource\":\"eBay, COMC\"}";
  const res=await fetch("https://card-vault-api.chris-9ca.workers.dev/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1500,system:"You are a trading card price lookup tool. Always respond with a single raw JSON object and nothing else.",tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:userMessage}]})});
  const raw=await res.text();
  let data;
  try{data=JSON.parse(raw);}catch(e){throw new Error("HTTP "+res.status+": "+raw.slice(0,150));}
  if(data.error)throw new Error((data.error.type||"API error")+": "+(data.error.message||JSON.stringify(data.error)));
  const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const cleaned=txt.replace(/```json|```/g,"").trim();
  let jsonStr=null,depth=0,start=-1;
  for(let i=0;i<cleaned.length;i++){if(cleaned[i]==="{"){if(depth===0)start=i;depth++;}else if(cleaned[i]==="}"){depth--;if(depth===0&&start!==-1){jsonStr=cleaned.slice(start,i+1);break;}}}
  if(!jsonStr)throw new Error("No JSON in response: "+cleaned.slice(0,200));
  const result=JSON.parse(jsonStr);
  if(!result.searchQuery)result.searchQuery=searchQuery;
  return result;
}

// ── Price router ──────────────────────────────────────────────────────────
async function fetchCardPrice(card) {
  if(card.sport==="Magic: The Gathering"){
    try{return await fetchScryfallPrice(card);}
    catch(e){console.warn("Scryfall failed, using Claude:",e.message);return await fetchClaudePrice(card);}
  }
  if(card.sport==="Pokemon"){
    try{return await fetchPokemonPrice(card);}
    catch(e){console.warn("Pokemon API failed, using Claude:",e.message);return await fetchClaudePrice(card);}
  }
  return await fetchClaudePrice(card);
}


// ── Price Cache (7-day expiry) ─────────────────────────────────────────────
const CACHE_DAYS = 7;

function getCachedPrice(card) {
  try {
    const key = "cv_price_" + [card.player, card.brand, card.cardNumber, card.grade, card.condition, card.notes].join("|").toLowerCase().replace(/\s+/g,"");
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const {pricing, timestamp} = JSON.parse(raw);
    const ageMs = Date.now() - timestamp;
    if (ageMs > CACHE_DAYS * 24 * 60 * 60 * 1000) { localStorage.removeItem(key); return null; }
    return pricing;
  } catch { return null; }
}

function setCachedPrice(card, pricing) {
  try {
    const key = "cv_price_" + [card.player, card.brand, card.cardNumber, card.grade, card.condition, card.notes].join("|").toLowerCase().replace(/\s+/g,"");
    localStorage.setItem(key, JSON.stringify({pricing, timestamp: Date.now()}));
  } catch {}
}

function getPriceAge(card) {
  try {
    const key = "cv_price_" + [card.player, card.brand, card.cardNumber, card.grade, card.condition, card.notes].join("|").toLowerCase().replace(/\s+/g,"");
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const {timestamp} = JSON.parse(raw);
    const days = Math.floor((Date.now() - timestamp) / (24*60*60*1000));
    return days === 0 ? "today" : days === 1 ? "1 day ago" : days + " days ago";
  } catch { return null; }
}

// ── CSV Parser ─────────────────────────────────────────────────────────────
function parseCSV(text){
  const lines=[];let cur="",inQ=false;
  const chars=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  let row=[];
  for(let i=0;i<chars.length;i++){
    const c=chars[i];
    if(c==='"'){if(inQ&&chars[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){row.push(cur);cur="";}
    else if(c==='\n'&&!inQ){row.push(cur);cur="";lines.push(row);row=[];}
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);lines.push(row);}
  return lines;
}

function mapRowToCard(obj){
  const norm={};
  for(const k of Object.keys(obj))norm[k.toLowerCase().replace(/[\s_]/g,"")]=obj[k];
  const get=(...keys)=>{for(const k of keys){const v=norm[k.replace(/[\s_]/g,"").toLowerCase()];if(v!==undefined&&v!=="")return String(v).trim();}return "";};
  const player=get("productname","cardname","name","player","subject","card","title")||"";
  if(!player)return null;
  const rawSport=get("category","sport","type","sporttype")||"";
  const SPORT_MAP={"magic":"Magic: The Gathering","mtg":"Magic: The Gathering","magic:thegathering":"Magic: The Gathering","pokemon":"Pokemon","yugioh":"Yu-Gi-Oh","yu-gi-oh":"Yu-Gi-Oh","baseball":"Baseball","basketball":"Basketball","football":"Football","hockey":"Hockey","soccer":"Soccer","tennis":"Tennis","golf":"Golf"};
  const sport=SPORT_MAP[rawSport.toLowerCase().replace(/[\s:]/g,"")]||rawSport||"Other";
  const gradeRaw=get("grade","psa","bgs","sgc","gradevalue")||"";
  const grade=/ungraded|raw|nm|near/i.test(gradeRaw)?"":gradeRaw.replace(/[^0-9.]/g,"");
  const gradeType=/bgs|beckett/i.test(gradeRaw)?"BGS":/sgc/i.test(gradeRaw)?"SGC":/cgc/i.test(gradeRaw)?"CGC":"PSA";
  const condRaw=get("cardcondition","condition","quality")||"";
  const COND_MAP={"nearmint":"Near Mint","nm":"Near Mint","mint":"Mint","excellent":"Excellent","verygood":"Very Good","good":"Good","fair":"Fair","poor":"Poor"};
  const condition=COND_MAP[condRaw.toLowerCase().replace(/[\s-]/g,"")]||condRaw||"";
  const variance=get("variance","variant","finish","printing")||"";
  const setNotes=get("notes","note","comments","comment")||"";
  const notes=[variance!=="Normal"?variance:"",setNotes].filter(Boolean).join("; ");
  return{player,sport,year:get("year","setyear")||"",brand:get("set","brand","setname","expansion","series")||"",cardNumber:get("cardnumber","number","num","#")||"",condition,grade,gradeType,rookie:/rookie|rc\b/i.test(get("notes","rarity","type","rookie","isrookie")+" "+player),notes};
}

function tryDirectParse(text,fileName){
  const ext=fileName.split(".").pop().toLowerCase();
  const rows=ext==="tsv"?text.split("\n").map(l=>l.split("\t")):parseCSV(text);
  if(rows.length<2)return null;
  const headers=rows[0].map(h=>h.trim());
  if(!headers.some(h=>/product.?name|card.?name|^name$|^player$|^subject$|^card$/i.test(h)))return null;
  const cards=[];
  for(let i=1;i<rows.length;i++){
    const row=rows[i];if(row.every(c=>!c.trim()))continue;
    const obj={};headers.forEach((h,idx)=>{obj[h]=row[idx]??"";});
    const card=mapRowToCard(obj);if(card)cards.push(card);
  }
  return cards.length>0?cards:null;
}

async function parseChunkWithClaude(chunk,fileName,idx,total){
  const headers={"Content-Type":"application/json"};
  const res=await fetch("https://card-vault-api.chris-9ca.workers.dev/api",{
    method:"POST",headers,
    body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:4000,
      messages:[{role:"user",content:'Parse every card from this file "'+fileName+'" chunk '+(idx+1)+'/'+total+'.\nReturn ONLY a JSON array, no markdown:\n[{"player":"","sport":"Other","year":"","brand":"","cardNumber":"","condition":"","grade":"","gradeType":"PSA","rookie":false,"notes":""}]\n\nContent:\n---\n'+chunk+'\n---'}]})
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const match=txt.replace(/```json|```/g,"").trim().match(/\[[\s\S]*\]/);
  if(!match)throw new Error("Parse error");
  return JSON.parse(match[0]);
}

async function parseFile(text,fileName,onProgress){
  const direct=tryDirectParse(text,fileName);
  if(direct)return direct;
  const CHUNK=6000;const lines=text.split("\n");const header=lines[0];
  const chunks=[];let cur="";
  for(let i=1;i<lines.length;i++){
    const line=lines[i];if(!line.trim())continue;
    if((cur+line).length>CHUNK&&cur){chunks.push(cur);cur=header+"\n"+line+"\n";}
    else cur+=line+"\n";
  }
  if(cur.trim())chunks.push(cur);
  let all=[];
  for(let i=0;i<chunks.length;i++){
    onProgress&&onProgress(i,chunks.length);
    const batch=await parseChunkWithClaude(chunks[i],fileName,i,chunks.length);
    all=all.concat(batch);
  }
  if(all.length===0)throw new Error("No cards found in file");
  return all;
}

async function readFileAsText(file){
  const ext=file.name.split(".").pop().toLowerCase();
  if(["xlsx","xls","xlsm","ods"].includes(ext)){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"array"});let txt="";wb.SheetNames.forEach(n=>{txt+="Sheet: "+n+"\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])+"\n\n";});res(txt);}catch(err){rej(err);}};
      r.onerror=rej;r.readAsArrayBuffer(file);
    });
  }
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file);});
}

// ── Upload Modal ───────────────────────────────────────────────────────────
function UploadModal({onAddCards,onClose}){
  const[state,setState]=useState("idle");
  const[parsedCards,setParsedCards]=useState([]);
  const[errorMsg,setErrorMsg]=useState("");
  const[fileName,setFileName]=useState("");
  const[progress,setProgress]=useState(null);
  const fileRef=useRef();

  const handleFile=async(file)=>{
    if(!file)return;
    setFileName(file.name);setState("parsing");setErrorMsg("");setProgress(null);
    try{
      const text=await readFileAsText(file);
      const cards=await parseFile(text,file.name,(done,total)=>setProgress({done,total}));
      setParsedCards(cards.map((c,i)=>({...c,_selected:true,_idx:i})));
      setState("preview");
    }catch(e){setErrorMsg(e.message||"Failed to parse file.");setState("error");}
  };

  const toggleCard=idx=>setParsedCards(prev=>prev.map(c=>c._idx===idx?{...c,_selected:!c._selected}:c));
  const toggleAll=()=>{const allOn=parsedCards.every(c=>c._selected);setParsedCards(prev=>prev.map(c=>({...c,_selected:!allOn})));};
  const confirmImport=()=>{onAddCards(parsedCards.filter(c=>c._selected).map(({_selected,_idx,...r})=>r));onClose();};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"#111",border:"1px solid #292524",borderRadius:"20px 20px 0 0",padding:"24px",width:"100%",maxWidth:"600px",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{width:"36px",height:"4px",background:"#292524",borderRadius:"2px",margin:"0 auto 20px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"18px"}}>
          <div>
            <h2 style={{color:"#f5f5f4",margin:0,fontSize:"17px",fontWeight:800}}>Import from File</h2>
            <div style={{color:"#57534e",fontSize:"11px",marginTop:"2px"}}>CSV · JSON · Excel · TSV · TXT</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#78716c",fontSize:"22px",cursor:"pointer",padding:"0 4px"}}>×</button>
        </div>

        {(state==="idle"||state==="error")&&(
          <div onClick={()=>fileRef.current.click()}
            style={{border:"2px dashed #292524",borderRadius:"12px",padding:"36px 20px",textAlign:"center",cursor:"pointer"}}>
            <div style={{fontSize:"28px",marginBottom:"8px"}}>📂</div>
            <div style={{color:"#d6d3d1",fontSize:"14px",fontWeight:700,marginBottom:"4px"}}>Tap to browse files</div>
            <div style={{color:"#57534e",fontSize:"11px"}}>CSV, JSON, Excel, TSV, plain text</div>
            <input ref={fileRef} type="file" accept=".csv,.json,.txt,.xlsx,.xls,.xlsm,.ods,.tsv,.md" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        )}
        {state==="error"&&<div style={{marginTop:"12px",background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"8px",padding:"10px 14px",color:"#f87171",fontSize:"12px"}}>⚠ {errorMsg}</div>}

        {state==="parsing"&&(
          <div style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:"28px",marginBottom:"12px",animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</div>
            <div style={{color:"#a8a29e",fontSize:"13px"}}>Reading {fileName}…</div>
            {progress&&<div style={{marginTop:"10px"}}>
              <div style={{color:"#57534e",fontSize:"11px"}}>Chunk {progress.done+1} of {progress.total}</div>
              <div style={{background:"#1c1917",borderRadius:"4px",height:"4px",margin:"6px auto",width:"140px"}}>
                <div style={{background:"#a3e635",borderRadius:"4px",height:"4px",width:`${(progress.done/progress.total)*100}%`,transition:"width 0.3s"}}/>
              </div>
            </div>}
          </div>
        )}

        {state==="preview"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <div style={{color:"#a8a29e",fontSize:"13px"}}>Found <span style={{color:"#a3e635",fontWeight:700}}>{parsedCards.length}</span> cards</div>
              <button onClick={toggleAll} style={{background:"transparent",border:"1px solid #292524",borderRadius:"6px",color:"#78716c",padding:"4px 10px",fontSize:"11px",cursor:"pointer"}}>{parsedCards.every(c=>c._selected)?"Deselect All":"Select All"}</button>
            </div>
            <div style={{maxHeight:"320px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"5px",marginBottom:"14px"}}>
              {parsedCards.map(card=>(
                <div key={card._idx} onClick={()=>toggleCard(card._idx)}
                  style={{background:card._selected?"#1a2e05":"#0f0f0f",border:`1px solid ${card._selected?"#365314":"#1c1917"}`,borderRadius:"8px",padding:"9px 12px",cursor:"pointer",display:"flex",gap:"10px",alignItems:"flex-start"}}>
                  <div style={{width:"15px",height:"15px",borderRadius:"4px",flexShrink:0,marginTop:"1px",background:card._selected?"#a3e635":"transparent",border:`2px solid ${card._selected?"#a3e635":"#44403c"}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {card._selected&&<span style={{color:"#0a0a0a",fontSize:"10px",fontWeight:900}}>✓</span>}
                  </div>
                  <div>
                    <div style={{color:"#f5f5f4",fontWeight:700,fontSize:"12px"}}>{card.player}{card.rookie&&<span style={{marginLeft:"5px",fontSize:"9px",background:"#7c2d12",color:"#fdba74",padding:"1px 5px",borderRadius:"10px"}}>RC</span>}</div>
                    <div style={{color:"#78716c",fontSize:"10px",marginTop:"2px"}}>{[card.year,card.brand,card.sport].filter(Boolean).join(" · ")}{card.grade&&` · ${card.gradeType||"PSA"} ${card.grade}`}{!card.grade&&card.condition&&` · ${card.condition}`}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:"8px"}}>
              <button onClick={onClose} style={{flex:1,background:"transparent",border:"1px solid #292524",borderRadius:"9px",color:"#78716c",padding:"11px",cursor:"pointer",fontSize:"13px"}}>Cancel</button>
              <button onClick={confirmImport} disabled={!parsedCards.some(c=>c._selected)}
                style={{flex:2,background:parsedCards.some(c=>c._selected)?"#365314":"#1c1917",border:`1px solid ${parsedCards.some(c=>c._selected)?"#4d7c0f":"#292524"}`,borderRadius:"9px",color:parsedCards.some(c=>c._selected)?"#a3e635":"#44403c",padding:"11px",cursor:parsedCards.some(c=>c._selected)?"pointer":"not-allowed",fontSize:"13px",fontWeight:700}}>
                Import {parsedCards.filter(c=>c._selected).length} Cards
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


// ── Scan Card Modal ────────────────────────────────────────────────────────
function ScanModal({onAdd,onClose}){
  const[state,setState]=useState("idle");
  const[preview,setPreview]=useState(null);
  const[form,setForm]=useState({player:"",sport:"Baseball",year:"",brand:"",cardNumber:"",condition:"Near Mint",grade:"",gradeType:"PSA",rookie:false,notes:""});
  const[errorMsg,setErrorMsg]=useState("");
  const[confidence,setConfidence]=useState(null);
  const fileRef=useRef();
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const inp={background:"#1c1917",border:"1px solid #292524",borderRadius:"8px",color:"#f5f5f4",padding:"9px 12px",fontSize:"13px",width:"100%",outline:"none"};
  const lbl={color:"#a8a29e",fontSize:"11px",fontWeight:700,letterSpacing:"0.08em",marginBottom:"4px",display:"block"};

  const analyzeImage=async(file)=>{
    setState("scanning");setErrorMsg("");
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const mime=file.type||"image/jpeg";
      const prompt="You are a trading card expert. Analyze this card image and extract all details.\n\nFor Magic: The Gathering cards:\n- Read the card name at the top\n- Read the collector number at bottom (e.g. 247/281 - use just first number)\n- Read the set code (3-4 letter code at bottom e.g. MH3, CMM, MKM)\n- Identify set name from set icon + code (MH3=Modern Horizons 3, CMM=Commander Masters, MKM=Murders at Karlov Manor, OTJ=Outlaws of Thunder Junction, BLB=Bloomburrow, DSK=Duskmourn, FDN=Foundations, etc.)\n- Note special treatments: Borderless, Extended Art, Foil, Showcase, Retro Frame, Surge Foil, Gold-Stamped Signature, Textured Foil, etc.\n\nFor Pokemon cards:\n- Read card name, HP, card number at bottom\n- Read set name printed at bottom\n- Note special types: V, VMAX, VSTAR, ex, GX, EX, Holo, Reverse Holo, Full Art, Secret Rare, etc.\n\nFor sports cards:\n- Read player name, year, brand/set, card number\n- Note if in PSA/BGS/SGC graded slab and read the grade\n- Note rookie card designation\n- Note variants: auto, patch, refractor, prizm, etc.\n\nReturn ONLY this JSON no markdown:\n{\"player\":\"\",\"sport\":\"Baseball|Basketball|Football|Hockey|Soccer|Tennis|Golf|Pokemon|Magic: The Gathering|Yu-Gi-Oh|Other\",\"year\":\"\",\"brand\":\"\",\"cardNumber\":\"\",\"condition\":\"Near Mint\",\"grade\":\"\",\"gradeType\":\"PSA\",\"rookie\":false,\"notes\":\"\",\"confidence\":\"high|medium|low\",\"confidenceReason\":\"\"}";
      const res=await fetch("https://card-vault-api.chris-9ca.workers.dev/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:600,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:base64}},{type:"text",text:prompt}]}]})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||"API error");
      const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      const clean=txt.replace(/```json|```/g,"").trim();
      let jsonStr=null,depth=0,start=-1;
      for(let i=0;i<clean.length;i++){if(clean[i]==="{"){if(depth===0)start=i;depth++;}else if(clean[i]==="}"){depth--;if(depth===0&&start!==-1){jsonStr=clean.slice(start,i+1);break;}}}
      if(!jsonStr)throw new Error("Could not read card details from image");
      const result=JSON.parse(jsonStr);
      setConfidence({level:result.confidence,reason:result.confidenceReason});
      setForm({player:result.player||"",sport:result.sport||"Other",year:result.year||"",brand:result.brand||"",cardNumber:result.cardNumber||"",condition:result.condition||"Near Mint",grade:result.grade||"",gradeType:result.gradeType||"PSA",rookie:!!result.rookie,notes:result.notes||""});
      setState("review");
    }catch(e){setErrorMsg(e.message||"Failed to analyze image");setState("error");}
  };

  const handleFile=async(file)=>{if(!file)return;setPreview(URL.createObjectURL(file));await analyzeImage(file);};
  const confColor=confidence?.level==="high"?"#4ade80":confidence?.level==="medium"?"#fbbf24":"#f87171";
  const confBg=confidence?.level==="high"?"#052e16":confidence?.level==="medium"?"#451a03":"#450a0a";

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"#111",border:"1px solid #292524",borderRadius:"20px 20px 0 0",padding:"24px",width:"100%",maxWidth:"600px",maxHeight:"95vh",overflowY:"auto"}}>
        <div style={{width:"36px",height:"4px",background:"#292524",borderRadius:"2px",margin:"0 auto 20px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"18px"}}>
          <div><h2 style={{color:"#f5f5f4",margin:0,fontSize:"17px",fontWeight:800}}>📷 Scan Card</h2><div style={{color:"#57534e",fontSize:"11px",marginTop:"2px"}}>Take a photo or upload an image</div></div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#78716c",fontSize:"22px",cursor:"pointer",padding:"0 4px"}}>×</button>
        </div>

        {(state==="idle"||state==="error")&&(
          <div>
            {preview&&<img src={preview} style={{width:"100%",maxHeight:"200px",objectFit:"contain",borderRadius:"10px",marginBottom:"14px",border:"1px solid #292524"}}/>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}}>
              <button onClick={()=>{fileRef.current.setAttribute("capture","environment");fileRef.current.click();}}
                style={{background:"#1a2e05",border:"1px solid #365314",borderRadius:"12px",color:"#a3e635",padding:"20px 12px",cursor:"pointer",fontSize:"13px",fontWeight:700,display:"flex",flexDirection:"column",alignItems:"center",gap:"8px"}}>
                <span style={{fontSize:"28px"}}>📷</span>Take Photo
              </button>
              <button onClick={()=>{fileRef.current.removeAttribute("capture");fileRef.current.click();}}
                style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"12px",color:"#d6d3d1",padding:"20px 12px",cursor:"pointer",fontSize:"13px",fontWeight:700,display:"flex",flexDirection:"column",alignItems:"center",gap:"8px"}}>
                <span style={{fontSize:"28px"}}>🖼️</span>Upload Image
              </button>
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
            {state==="error"&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"8px",padding:"10px 14px",color:"#f87171",fontSize:"12px",marginBottom:"10px"}}>⚠ {errorMsg} — try a clearer photo or <button onClick={onClose} style={{background:"none",border:"none",color:"#a3e635",cursor:"pointer",fontSize:"12px",textDecoration:"underline",padding:0}}>add manually</button></div>}
            <div style={{background:"#0f0f0f",border:"1px solid #1c1917",borderRadius:"10px",padding:"12px 14px"}}>
              <div style={{color:"#57534e",fontSize:"10px",fontWeight:700,letterSpacing:"0.1em",marginBottom:"6px"}}>TIPS FOR BEST RESULTS</div>
              <div style={{color:"#44403c",fontSize:"11px",lineHeight:1.7}}>• Lay card flat, good lighting, no glare<br/>• Include full card in frame<br/>• For MTG: make sure bottom collector info is visible<br/>• For graded cards: photograph the slab label</div>
            </div>
          </div>

        {state==="scanning"&&(
          <div style={{textAlign:"center",padding:"30px 20px"}}>

            <div style={{fontSize:"28px",marginBottom:"12px",animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</div>

            <div style={{color:"#57534e",fontSize:"11px"}}>Reading name, set, number, condition</div>

        {state==="review"&&(

            {preview&&<img src={preview} style={{width:"100%",maxHeight:"140px",objectFit:"contain",borderRadius:"10px",marginBottom:"12px",border:"1px solid #292524"}}/>}
            {confidence&&(
              <div style={{background:confBg,border:`1px solid ${confColor}40`,borderRadius:"8px",padding:"8px 12px",marginBottom:"10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{color:confColor,fontSize:"11px",fontWeight:700}}>{confidence.level==="high"?"✓ High confidence":confidence.level==="medium"?"⚠ Medium — please verify":"⚠ Low — please correct details"}</span>

              </div>

            {confidence?.reason&&<div style={{color:"#57534e",fontSize:"11px",marginBottom:"10px",fontStyle:"italic"}}>"{confidence.reason}"</div>}
            <div style={{display:"grid",gap:"11px"}}>
              <div><label style={lbl}>PLAYER / SUBJECT *</label><input style={inp} value={form.player} onChange={e=>set("player",e.target.value)}/></div>

          <div><label style={lbl}>PLAYER / SUBJECT *</label><input style={inp} value={form.player} onChange={e=>set("player",e.target.value)} placeholder="e.g. Mickey Mantle"/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
            <div><label style={lbl}>SPORT / TYPE</label><select style={inp} value={form.sport} onChange={e=>set("sport",e.target.value)}>{SPORTS.map(s=><option key={s}>{s}</option>)}</select></div>
            <div><label style={lbl}>YEAR</label><input style={inp} value={form.year} onChange={e=>set("year",e.target.value)} placeholder="e.g. 1952"/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
            <div><label style={lbl}>BRAND / SET</label><input style={inp} value={form.brand} onChange={e=>set("brand",e.target.value)} placeholder="e.g. Topps"/></div>
            <div><label style={lbl}>CARD #</label><input style={inp} value={form.cardNumber} onChange={e=>set("cardNumber",e.target.value)} placeholder="e.g. 311"/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px"}}>
            <div><label style={lbl}>GRADER</label><select style={inp} value={form.gradeType} onChange={e=>set("gradeType",e.target.value)}>{["PSA","BGS","SGC","CGC","HGA"].map(g=><option key={g}>{g}</option>)}</select></div>
            <div><label style={lbl}>GRADE</label><input style={inp} value={form.grade} onChange={e=>set("grade",e.target.value)} placeholder="e.g. 9"/></div>
            <div><label style={lbl}>CONDITION</label><select style={inp} value={form.condition} onChange={e=>set("condition",e.target.value)} disabled={!!form.grade}>{["Mint","Near Mint","Excellent","Very Good","Good","Fair","Poor"].map(c=><option key={c}>{c}</option>)}</select></div>
          </div>
          <div><label style={lbl}>NOTES</label><input style={inp} value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="foil, auto, patch, borderless…"/></div>
          <label style={{display:"flex",alignItems:"center",gap:"10px",cursor:"pointer"}}>
            <input type="checkbox" checked={form.rookie} onChange={e=>set("rookie",e.target.checked)}/>
            <span style={{color:"#a8a29e",fontSize:"13px"}}>Rookie Card (RC)</span>
          </label>
        </div>
        <div style={{display:"flex",gap:"8px",marginTop:"20px"}}>
          <button onClick={onClose} style={{flex:1,background:"transparent",border:"1px solid #292524",borderRadius:"9px",color:"#78716c",padding:"11px",cursor:"pointer",fontSize:"13px"}}>Cancel</button>
          <button onClick={()=>{if(form.player.trim()){onAdd(form);onClose();}}}
            style={{flex:2,background:"#365314",border:"1px solid #4d7c0f",borderRadius:"9px",color:"#a3e635",padding:"11px",cursor:"pointer",fontSize:"13px",fontWeight:700}}>
            Add to Collection
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App(){
  const[cards,setCards]=useState(()=>{try{return JSON.parse(localStorage.getItem("cv_cards")||"[]");}catch{return [];}});
  const[showManual,setShowManual]=useState(false);
  const[showUpload,setShowUpload]=useState(false);
  const[showScan,setShowScan]=useState(false);
  const[priceAllStatus,setPriceAllStatus]=useState(null);
  
  const nextId=useRef(Math.max(0,...(cards.map(c=>c.id||0)))+1);

  useEffect(()=>{localStorage.setItem("cv_cards",JSON.stringify(cards));},[cards]);

  const addCard=form=>setCards(c=>[...c,{...form,id:nextId.current++,pricing:null,loadingPrice:false}]);
  const addCards=forms=>{const n=forms.map(f=>({...f,id:nextId.current++,pricing:null,loadingPrice:false}));setCards(c=>[...c,...n]);};
  const deleteCard=id=>setCards(c=>c.filter(card=>card.id!==id));

  const lookupPrice=async(id)=>{
    
    setCards(c=>c.map(card=>card.id===id?{...card,loadingPrice:true}:card));
    try{
      const card=cards.find(c=>c.id===id);
      const pricing=await fetchCardPrice(card);
      setCards(c=>c.map(card=>card.id===id?{...card,pricing,loadingPrice:false}:card));
    }catch(e){
      setCards(c=>c.map(card=>card.id===id?{...card,loadingPrice:false,pricing:{summary:"Error: "+e.message,avgPrice:null,lowPrice:null,highPrice:null,marketTrend:"Insufficient Data",recentSales:[],searchQuery:cards.find(c=>c.id===id)?.player||""}}:card));
    }
  };
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const lookupAll=async()=>{
    const uncached=[];
    for(const card of cards){
      if(card.loadingPrice)continue;
      const cached=getCachedPrice(card);
      if(cached){setCards(c=>c.map(c2=>c2.id===card.id?{...c2,pricing:cached}:c2));}
      else uncached.push(card);
    }
    if(uncached.length===0){alert("All prices are up to date!");return;}
    const estMin=Math.ceil(uncached.length*3/60);
    if(!window.confirm("Fetch prices for "+uncached.length+" cards?\nEst. time: ~"+estMin+" min\nEst. cost: ~$"+(uncached.length*0.002).toFixed(2)+"\n\nRate limited requests retry automatically."))return;
    for(let i=0;i<uncached.length;i++){
      const card=uncached[i];
      setPriceAllStatus({current:i+1,total:uncached.length,cardName:card.player,retrying:false});
      let attempts=0;
      while(attempts<3){
        try{
          const pricing=await fetchCardPrice(card);
          setCachedPrice(card,pricing);
          setCards(c=>c.map(c2=>c2.id===card.id?{...c2,pricing,loadingPrice:false}:c2));
          break;
        }catch(e){
          attempts++;
          if(e.message&&e.message.includes("rate_limit")&&attempts<3){
            setPriceAllStatus(s=>({...s,retrying:true}));
            await sleep(30000);
            setPriceAllStatus(s=>({...s,retrying:false}));
          }else{
            setCards(c=>c.map(c2=>c2.id===card.id?{...c2,loadingPrice:false,pricing:{summary:"Error: "+e.message,avgPrice:null,lowPrice:null,highPrice:null,marketTrend:"Insufficient Data",recentSales:[],searchQuery:card.player}}:c2));
            break;
          }
        }
      }
      if(i<uncached.length-1)await sleep(3000);
    }
    setPriceAllStatus(null);
  };

  const totalValue=cards.reduce((s,c)=>s+(c.pricing?.avgPrice||0),0);
  const priced=cards.filter(c=>c.pricing?.avgPrice).length;

  return(
    <div style={{minHeight:"100vh",background:"#0a0a0a",color:"#f5f5f4",fontFamily:"'DM Mono','Courier New',monospace",paddingBottom:"env(safe-area-inset-bottom)"}}>
      {/* Header */}
      <div style={{borderBottom:"1px solid #1c1917",padding:"16px 16px",paddingTop:"max(16px, env(safe-area-inset-top))",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#0a0a0a",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          <div style={{background:"#1a2e05",border:"1px solid #365314",borderRadius:"9px",padding:"7px"}}><CardIcon/></div>
          <div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"20px",letterSpacing:"0.1em",color:"#a3e635"}}>CARD VAULT</div>
            <div style={{color:"#57534e",fontSize:"10px"}}>{cards.length} cards · Multi-Platform Tracker</div>
          </div>
        </div>
        <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
          {cards.length>0&&<button onClick={lookupAll} style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"7px",color:"#a8a29e",padding:"7px 10px",fontSize:"11px",cursor:"pointer"}}>Price All</button>}
          <button onClick={()=>setShowUpload(true)} style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"7px",color:"#d6d3d1",padding:"7px 10px",fontSize:"11px",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px"}}><UploadIcon/>Import</button>
          <button onClick={()=>setShowScan(true)} style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"7px",color:"#d6d3d1",padding:"7px 10px",fontSize:"11px",cursor:"pointer"}}>📷</button><button onClick={()=>setShowManual(true)} style={{background:"#a3e635",border:"none",borderRadius:"7px",color:"#0a0a0a",padding:"7px 12px",fontSize:"11px",fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:"5px"}}><PlusIcon/>Add</button>
        </div>
      </div>

      {/* Stats */}
      {cards.length>0&&(
        <div style={{borderBottom:"1px solid #1c1917",padding:"12px 16px",display:"flex",gap:"24px",background:"#0c0c0c"}}>
          <div><div style={{color:"#57534e",fontSize:"10px",letterSpacing:"0.1em"}}>CARDS</div><div style={{color:"#f5f5f4",fontSize:"20px",fontFamily:"'Bebas Neue'",letterSpacing:"0.05em"}}>{cards.length}</div></div>
          <div><div style={{color:"#57534e",fontSize:"10px",letterSpacing:"0.1em"}}>PRICED</div><div style={{color:"#f5f5f4",fontSize:"20px",fontFamily:"'Bebas Neue'",letterSpacing:"0.05em"}}>{priced}</div></div>
          <div><div style={{color:"#57534e",fontSize:"10px",letterSpacing:"0.1em"}}>EST. VALUE</div><div style={{color:"#a3e635",fontSize:"20px",fontFamily:"'Bebas Neue'",letterSpacing:"0.05em"}}>{priced>0?`$${totalValue.toFixed(2)}`:"—"}</div></div>
          
        </div>
      )}

      {/* Progress bar */}
      {priceAllStatus&&(
        <div style={{position:"sticky",top:0,zIndex:8,background:"#0f1a00",borderBottom:"2px solid #4d7c0f",padding:"8px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
            <span style={{color:"#a3e635",fontSize:"12px",fontWeight:700}}>⟳ Pricing collection…</span>
            <span style={{color:"#a3e635",fontSize:"12px",fontWeight:700}}>{priceAllStatus.current} / {priceAllStatus.total}</span>
          </div>
          <div style={{background:"#1c1917",borderRadius:"4px",height:"6px",marginBottom:"4px"}}>
            <div style={{background:"#a3e635",borderRadius:"4px",height:"6px",width:`${(priceAllStatus.current/priceAllStatus.total)*100}%`,transition:"width 0.5s"}}/>
          </div>
          <div style={{color:"#78716c",fontSize:"11px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>↳ {priceAllStatus.cardName}{priceAllStatus.retrying?" — rate limited, waiting 30s…":""}</div>
        </div>
      )}

      {/* List */}
      <div style={{padding:"16px",maxWidth:"700px",margin:"0 auto"}}>
        {cards.length===0?(
          <div style={{textAlign:"center",padding:"60px 20px"}}>
            <div style={{fontSize:"48px",marginBottom:"14px"}}>🃏</div>
            <div style={{color:"#57534e",fontSize:"15px",marginBottom:"6px"}}>No cards yet</div>
            <div style={{color:"#44403c",fontSize:"12px",marginBottom:"22px"}}>Import a file or add cards manually</div>
            <div style={{display:"flex",gap:"10px",justifyContent:"center"}}>
              <button onClick={()=>setShowUpload(true)} style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"10px",color:"#d6d3d1",padding:"11px 18px",fontSize:"12px",fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:"7px"}}><UploadIcon/>Import File</button>
              <button onClick={()=>setShowScan(true)} style={{background:"#1c1917",border:"1px solid #292524",borderRadius:"10px",color:"#d6d3d1",padding:"11px 18px",fontSize:"12px",fontWeight:700,cursor:"pointer"}}>📷 Scan Card</button><button onClick={()=>setShowManual(true)} style={{background:"#1a2e05",border:"1px solid #365314",borderRadius:"10px",color:"#a3e635",padding:"11px 18px",fontSize:"12px",fontWeight:700,cursor:"pointer"}}>+ Add Manually</button>
            </div>
            
          </div>
        ):(
          cards.map(card=><CardRow key={card.id} card={card} onLookup={lookupPrice} onDelete={deleteCard}/>)
        )}
      </div>

      {showScan&&<ScanModal onAdd={addCard} onClose={()=>setShowScan(false)}/>}
      {showManual&&<AddCardModal onAdd={addCard} onClose={()=>setShowManual(false)}/>}
      {showUpload&&<UploadModal onAddCards={addCards} onClose={()=>setShowUpload(false)}/>}
      
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
